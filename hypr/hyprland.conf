# Monitor
monitor=eDP-1,2560x1600@240,1920x0,1.25
monitor=HDMI-A-1,1920x1080@100,0x0,1

# Autostart
exec-once = bash -c 'caelestia wallpaper -f "$(quickshell -c caelestia ipc call wallpaper get)" -N'
exec-once = wl-paste --watch cliphist store
exec-once = fcitx5 -d
exec-once = systemctl --user start xdg-desktop-portal
exec-once = systemctl --user start caelestia-shell.service

# Environment
env = XCURSOR_SIZE,24
env = PATH,/home/cuong/.local/bin:/usr/local/bin:/usr/bin:/bin
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

# NVIDIA Wayland
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Input
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
    sensitivity = 0
}

# General
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(9ccbfbee)
    col.inactive_border = rgba(101418aa)
    layout = dwindle
}

# Decoration
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 8
        passes = 2
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
    }
}

# Animations
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Layout
dwindle {
    preserve_split = yes
}

# Keybinds
$mod = SUPER

bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod, S, exec, quickshell -c caelestia ipc call drawers toggle sidebar
bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, E, exec, nautilus
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, Space, exec, quickshell -c caelestia ipc call drawers toggle launcher
bind = , Print, exec, /usr/local/bin/grimblast --notify copy screen
bind = $mod SHIFT, S, exec, bash -c "/usr/local/bin/grimblast --notify save area /tmp/ss.png && swappy -f /tmp/ss.png"
bind = $mod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Move focus
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Switch workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Mouse binds
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Move window to other monitor
bind = $mod SHIFT, comma, movewindow, mon:HDMI-A-1
bind = $mod SHIFT, period, movewindow, mon:eDP-1

# Volume / brightness
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
